name: vaktija
description: "Vaktija mobile app."
publish_to: 'none'
version: 1.1.2+2

environment:
  sdk: ^3.12.2

dependencies:
  code_assets: ^1.2.1
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  geomag: ^0.3.0
  intl: ^0.20.3
  hooks: ^2.0.2
  native_toolchain_c: ^0.19.2
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  unorm_dart: ^0.3.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/duas/
    - assets/prayer_times/
    - assets/qibla/
    - native/geographiclib/LICENSE.txt
    - assets/fonts/source-sans-3-OFL.txt
    - assets/fonts/cormorant-garamond-OFL.txt
    - assets/fonts/amiri-OFL.txt
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri-arabic.ttf
    - family: Vaktija Sans
      fonts:
        - asset: assets/fonts/vaktija-sans-400.ttf
          weight: 400
        - asset: assets/fonts/vaktija-sans-500.ttf
          weight: 500
        - asset: assets/fonts/vaktija-sans-600.ttf
          weight: 600
        - asset: assets/fonts/vaktija-sans-700.ttf
          weight: 700
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/cormorant-garamond-600.ttf
          weight: 600
