<router-outlet />
<dialog
  #methodIntro
  class="method-intro"
  [attr.lang]="language.lang()"
  aria-labelledby="method-intro-title"
  aria-describedby="method-intro-description"
  (cancel)="keepMethodIntroOpen($event)"
>
  <span class="method-intro-corners" aria-hidden="true"></span>
  <span class="method-intro-corners method-intro-corners-bottom" aria-hidden="true"></span>
  <img class="method-intro-emblem" src="/assets/ornaments/dua-crescent-rosette.webp" alt="" width="72" height="72" />
  <h1 id="method-intro-title">{{ labels().methodIntroTitle }}</h1>
  <p id="method-intro-description">{{ labels().methodIntroDescription }}</p>
  <div class="method-intro-options">
    <button type="button" (click)="chooseMethod('14.6')">
      <span class="method-intro-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 39h40M18 46h28M24 52h16" />
          <path d="M20 36a12 12 0 0 1 24 0" fill="currentColor" fill-opacity=".22" />
          <path d="M32 10v6M15 17l4 4M49 17l-4 4M8 31h6M50 31h6M22 10l2 5M42 10l-2 5" />
        </svg>
      </span>
      <span class="method-intro-copy">
        <span class="method-intro-name">{{ labels().method146Label }}</span>
        <span class="method-intro-summary">{{ labels().method146Summary }}</span>
      </span>
    </button>
    <button type="button" (click)="chooseMethod('iz')">
      <span class="method-intro-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <!-- Simplified BIH outline from Natural Earth 10m Admin 0 Countries (public domain): https://www.naturalearthdata.com/downloads/10m-cultural-vectors/10m-admin-0-countries/ -->
          <path d="M31.8 53.3 30.4 52.4 31.9 51.8 31.4 50.1 26.4 44.8 26.1 41.5 22.5 39.7 12.1 28.7 10.4 26.1 9 19.6 7.3 19.2 7.6 17.5 3.2 14.5 4.6 5.4 7.5 5.3 9 7.7 11.9 9.7 15.1 5.1 19.3 6 21 3.8 24.9 6.7 26.1 5.8 29.2 7.4 32.3 6.3 34.5 8.4 37 6.6 39.2 7.7 40.5 6.5 44.6 8.6 47 7.9 48.7 9.7 48.6 11.5 50.2 12.6 54.6 11.2 57.3 12.1 56.5 15.6 53.7 19.7 53.4 22.5 54.1 24.3 56.4 24.7 60.9 29.3 59.7 30.9 55.9 30.1 55.2 31.3 58.7 35.3 59.1 39.4 57.9 39.9 57 38.5 55 40 52.6 40.6 51.5 39.8 50.5 40.6 52.8 44.7 51.7 45.5 50.7 43.9 49.1 44 46.8 46.2 46.4 50.6 43.7 51.2 43.5 54.8 45.1 57.9 44.3 60 42.7 60 36.9 56.4 34.1 52.9 32 53Z" />
          <path d="M35 22a8 8 0 1 0 8.5 12A7.5 7.5 0 0 1 35 22Z" fill="currentColor" stroke="none" />
          <path d="m44 19 1 2.2 2.4.2-1.8 1.6.5 2.3-2.1-1.2-2.1 1.2.5-2.3-1.8-1.6 2.4-.2Z" fill="currentColor" stroke="none" />
        </svg>
      </span>
      <span class="method-intro-copy">
        <span class="method-intro-name">{{ labels().methodIzLabel }}</span>
        <span class="method-intro-summary">{{ labels().methodIzSummary }}</span>
      </span>
    </button>
  </div>
  <div class="method-intro-footer">
    <span class="method-intro-divider" aria-hidden="true"></span>
    <p>{{ labels().methodIntroLater }}</p>
  </div>
</dialog>
