<router-outlet />
<dialog
  #methodIntro
  class="method-intro"
  [attr.lang]="language.lang()"
  aria-labelledby="method-intro-title"
  aria-describedby="method-intro-description"
  (cancel)="keepMethodIntroOpen($event)"
>
  <span class="method-intro-corners" aria-hidden="true"></span>
  <span class="method-intro-corners method-intro-corners-bottom" aria-hidden="true"></span>
  <img class="method-intro-emblem" src="/assets/ornaments/dua-crescent-rosette.webp" alt="" width="72" height="72" />
  <h1 id="method-intro-title">{{ labels().methodIntroTitle }}</h1>
  <p id="method-intro-description">{{ labels().methodIntroDescription }}</p>
  <div class="method-intro-options">
    <button type="button" [attr.aria-pressed]="selectedMethod() === '14.6'" (click)="selectedMethod.set('14.6')">
      <span class="method-intro-icon" aria-hidden="true">
        <img class="method-intro-146-mark" src="/assets/icons/14-6-prayer-method-icon.webp" alt="" width="96" height="96" />
      </span>
      <span class="method-intro-copy">
        <span class="method-intro-name">{{ labels().method146Label }}</span>
        <span class="method-intro-summary">{{ labels().method146Summary }}</span>
      </span>
      <span class="method-intro-choice" aria-hidden="true"></span>
    </button>
    <button type="button" [attr.aria-pressed]="selectedMethod() === 'iz'" (click)="selectedMethod.set('iz')">
      <span class="method-intro-icon" aria-hidden="true">
        <span class="method-intro-iz-mark"></span>
      </span>
      <span class="method-intro-copy">
        <span class="method-intro-name">{{ labels().methodIzLabel }}</span>
        <span class="method-intro-summary">{{ labels().methodIzSummary }}</span>
      </span>
      <span class="method-intro-choice" aria-hidden="true"></span>
    </button>
  </div>
  <button class="method-intro-confirm" type="button" (click)="chooseMethod()">{{ labels().methodIntroConfirm }}</button>
  <div class="method-intro-footer">
    <span class="method-intro-divider" aria-hidden="true"></span>
    <p>{{ labels().methodIntroLater }}</p>
  </div>
</dialog>
